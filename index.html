<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayogi Creative — Web Developer WordPress, WooCommerce, Laravel</title>
<meta name="description" content="Freelance web developer Indonesia. WordPress, WooCommerce, Elementor, custom plugin, Laravel & CodeIgniter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f19;
    --bg2: #111827;
    --card: #151c2c;
    --border: #1f2a3f;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #22d3ee;
    --accent2: #06b6d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  section { padding: 96px 0; }
  h2 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); margin-bottom: 48px; font-size: 1.05rem; }
  .btn {
    display: inline-block; padding: 14px 28px; border-radius: 10px;
    font-weight: 600; transition: all .2s; border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: #0b0f19; }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-2px); }
  .btn-outline { border-color: var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  /* nav */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11,15,25,.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 32px; align-items: center; list-style: none; }
  .nav-links a { color: var(--muted); font-weight: 500; font-size: .95rem; transition: color .2s; }
  .nav-links a:hover { color: var(--text); }
  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .lang-toggle button {
    background: none; border: 0; color: var(--muted); padding: 6px 12px;
    font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .lang-toggle button.active { background: var(--accent); color: #0b0f19; }
  .burger { display: none; background: none; border: 0; color: var(--text); font-size: 1.6rem; cursor: pointer; }

  /* hero */
  .hero { padding: 140px 0 120px; text-align: center; position: relative; overflow: hidden; }
  .hero::before {
    content: ''; position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
    width: 800px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,.15), transparent 70%);
    pointer-events: none;
  }
  .badge {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--accent); font-size: .85rem;
    font-weight: 500; margin-bottom: 24px; background: var(--bg2);
  }
  .hero h1 {
    font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 800; line-height: 1.15;
    letter-spacing: -0.03em; max-width: 820px; margin: 0 auto 20px;
  }
  .hero p { color: var(--muted); font-size: 1.15rem; max-width: 640px; margin: 0 auto 40px; }
  .hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  /* grids */
  .grid { display: grid; gap: 24px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px; transition: all .25s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-4px); }
  .card .icon { font-size: 1.8rem; margin-bottom: 16px; }
  .card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
  .card p { color: var(--muted); font-size: .95rem; }

  /* stack */
  .stack-list { display: flex; flex-wrap: wrap; gap: 12px; }
  .stack-list span {
    padding: 10px 18px; border-radius: 8px; background: var(--card);
    border: 1px solid var(--border); font-weight: 500; font-size: .9rem;
  }

  /* process */
  .step { position: relative; }
  .step .num {
    width: 44px; height: 44px; border-radius: 10px; background: var(--accent);
    color: #0b0f19; font-weight: 800; display: flex; align-items: center;
    justify-content: center; margin-bottom: 16px; font-size: 1.1rem;
  }

  /* contact */
  .contact-item .label { color: var(--muted); font-size: .85rem; margin-bottom: 4px; }
  .contact-item .value { font-weight: 600; word-break: break-word; }
  .contact-item .value a:hover { color: var(--accent); }

  footer {
    border-top: 1px solid var(--border); padding: 32px 0; text-align: center;
    color: var(--muted); font-size: .9rem;
  }

  @media (max-width: 900px) {
    .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    section { padding: 64px 0; }
    .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .burger { display: block; }
    .nav-links {
      display: none; position: absolute; top: 68px; left: 0; right: 0;
      flex-direction: column; background: var(--bg2); padding: 20px 24px;
      border-bottom: 1px solid var(--border); gap: 18px;
    }
    .nav-links.open { display: flex; }
  }
</style>
</head>
<body>

<header>
  <nav class="container">
    <a href="#" class="logo">Sayogi<span>Creative</span></a>
    <ul class="nav-links">
      <li><a href="#services" data-i18n="nav.services"></a></li>
      <li><a href="#addons" data-i18n="nav.addons"></a></li>
      <li><a href="#process" data-i18n="nav.process"></a></li>
      <li><a href="#contact" data-i18n="nav.contact"></a></li>
      <li class="lang-toggle">
        <button data-lang="id">ID</button>
        <button data-lang="en">EN</button>
      </li>
    </ul>
    <button class="burger" aria-label="Menu">☰</button>
  </nav>
</header>

<section class="hero">
  <div class="container">
    <div class="badge" data-i18n="hero.badge"></div>
    <h1 data-i18n="hero.title"></h1>
    <p data-i18n="hero.subtitle"></p>
    <div class="hero-cta">
      <a href="#services" class="btn btn-primary" data-i18n="hero.cta1"></a>
      <a href="#contact" class="btn btn-outline" data-i18n="hero.cta2"></a>
    </div>
  </div>
</section>

<section id="services">
  <div class="container">
    <h2 data-i18n="services.title"></h2>
    <p class="subtitle" data-i18n="services.subtitle"></p>
    <div class="grid grid-3">
      <div class="card"><div class="icon">🛒</div><h3 data-i18n="services.1.title"></h3><p data-i18n="services.1.desc"></p></div>
      <div class="card"><div class="icon">🔌</div><h3 data-i18n="services.2.title"></h3><p data-i18n="services.2.desc"></p></div>
      <div class="card"><div class="icon">🎨</div><h3 data-i18n="services.3.title"></h3><p data-i18n="services.3.desc"></p></div>
      <div class="card"><div class="icon">⚡</div><h3 data-i18n="services.4.title"></h3><p data-i18n="services.4.desc"></p></div>
      <div class="card"><div class="icon">🔥</div><h3 data-i18n="services.5.title"></h3><p data-i18n="services.5.desc"></p></div>
      <div class="card"><div class="icon">🛠️</div><h3 data-i18n="services.6.title"></h3><p data-i18n="services.6.desc"></p></div>
    </div>
  </div>
</section>

<section id="addons" style="background: var(--bg2);">
  <div class="container">
    <h2 data-i18n="addons.title"></h2>
    <p class="subtitle" data-i18n="addons.subtitle"></p>
    <div class="grid grid-3">
      <div class="card"><div class="icon">🩹</div><h3 data-i18n="addons.1.title"></h3><p data-i18n="addons.1.desc"></p></div>
      <div class="card"><div class="icon">🧩</div><h3 data-i18n="addons.2.title"></h3><p data-i18n="addons.2.desc"></p></div>
      <div class="card"><div class="icon">🖼️</div><h3 data-i18n="addons.3.title"></h3><p data-i18n="addons.3.desc"></p></div>
      <div class="card"><div class="icon">🔄</div><h3 data-i18n="addons.4.title"></h3><p data-i18n="addons.4.desc"></p></div>
      <div class="card"><div class="icon">🌐</div><h3 data-i18n="addons.5.title"></h3><p data-i18n="addons.5.desc"></p></div>
      <div class="card"><div class="icon">🔗</div><h3 data-i18n="addons.6.title"></h3><p data-i18n="addons.6.desc"></p></div>
    </div>
  </div>
</section>

<section id="stack">
  <div class="container">
    <h2 data-i18n="stack.title"></h2>
    <p class="subtitle" data-i18n="stack.subtitle"></p>
    <div class="stack-list">
      <span>WordPress</span><span>WooCommerce</span><span>Elementor</span><span>PHP</span>
      <span>Laravel</span><span>CodeIgniter</span><span>MySQL</span><span>JavaScript</span>
      <span>Tailwind CSS</span><span>REST API</span><span>Git</span><span>Linux / cPanel</span>
    </div>
  </div>
</section>

<section id="process" style="background: var(--bg2);">
  <div class="container">
    <h2 data-i18n="process.title"></h2>
    <p class="subtitle" data-i18n="process.subtitle"></p>
    <div class="grid grid-4">
      <div class="card step"><div class="num">1</div><h3 data-i18n="process.1.title"></h3><p data-i18n="process.1.desc"></p></div>
      <div class="card step"><div class="num">2</div><h3 data-i18n="process.2.title"></h3><p data-i18n="process.2.desc"></p></div>
      <div class="card step"><div class="num">3</div><h3 data-i18n="process.3.title"></h3><p data-i18n="process.3.desc"></p></div>
      <div class="card step"><div class="num">4</div><h3 data-i18n="process.4.title"></h3><p data-i18n="process.4.desc"></p></div>
    </div>
  </div>
</section>

<section id="contact">
  <div class="container">
    <h2 data-i18n="contact.title"></h2>
    <p class="subtitle" data-i18n="contact.subtitle"></p>
    <div class="grid grid-4">
      <div class="card contact-item"><div class="label" data-i18n="contact.email"></div><div class="value"><a href="mailto:hello@sayogicreative.com">hello@sayogicreative.com</a></div></div>
      <div class="card contact-item"><div class="label" data-i18n="contact.whatsapp"></div><div class="value"><a href="https://wa.me/6281234567890" target="_blank" rel="noopener">+62 812-3456-7890</a></div></div>
      <div class="card contact-item"><div class="label" data-i18n="contact.location"></div><div class="value" data-i18n="contact.location.value"></div></div>
      <div class="card contact-item"><div class="label" data-i18n="contact.hours"></div><div class="value" data-i18n="contact.hours.value"></div></div>
    </div>
  </div>
</section>

<footer>
  <div class="container" data-i18n="footer.text"></div>
</footer>

<script src="lang.js"></script>
<script src="script.js"></script>
</body>
</html>
