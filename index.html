<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayogi Creative — Web Developer WordPress, WooCommerce, Laravel</title>
<meta name="description" content="Freelance web developer Indonesia. WordPress, WooCommerce, Elementor, custom plugin, Laravel & CodeIgniter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f19;
    --bg2: #111827;
    --card: #151c2c;
    --border: #1f2a3f;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #22d3ee;
    --accent2: #06b6d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  section { padding: 96px 0; }
  h2 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); margin-bottom: 48px; font-size: 1.05rem; }
  .btn {
    display: inline-block; padding: 14px 28px; border-radius: 10px;
    font-weight: 600; border: 1px solid transparent;
    transition: background .25s ease, border-color .25s ease, color .25s ease;
  }
  .btn-primary { background: var(--accent); color: #0b0f19; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-outline { border-color: var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  /* loader */
  .loader {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: clamp(24px, 5vw, 64px);
    transition: transform 1s cubic-bezier(.65, .05, .36, 1);
  }
  .loader.done { transform: translateY(-101%); }
  .loader-label { font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.6rem); letter-spacing: -0.02em; }
  .loader-label span { color: var(--accent); }
  .loader-count {
    font-weight: 800; font-size: clamp(4rem, 20vw, 13rem);
    line-height: .8; letter-spacing: -0.04em; color: var(--accent);
  }
  .loader-bar { position: absolute; bottom: 0; inset-inline-start: 0; height: 2px; width: 0; background: var(--accent); }

  /* nav */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11, 15, 25, .6); backdrop-filter: blur(12px);
    border-bottom: 1px solid transparent;
    transition: background .4s ease, border-color .4s ease;
  }
  header.scrolled { background: rgba(11, 15, 25, .92); border-bottom-color: var(--border); }
  nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 32px; align-items: center; list-style: none; }
  .nav-links li:not(.lang-switch) a {
    position: relative; color: var(--muted); font-weight: 500; font-size: .95rem;
    transition: color .25s ease;
  }
  .nav-links li:not(.lang-switch) a::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 1px;
    background: var(--accent); transform: scaleX(0); transform-origin: right;
    transition: transform .4s cubic-bezier(.16, 1, .3, 1);
  }
  .nav-links li:not(.lang-switch) a:hover { color: var(--text); }
  .nav-links li:not(.lang-switch) a:hover::after { transform: scaleX(1); transform-origin: left; }
  .lang-switch { position: relative; }
  .lang-switch summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); font-size: .8rem; font-weight: 600; transition: all .2s;
  }
  .lang-switch summary::-webkit-details-marker { display: none; }
  .lang-switch summary::after {
    content: ''; width: 0; height: 0; margin-top: 2px;
    border: 4px solid transparent; border-top-color: currentColor;
  }
  .lang-switch summary:hover { color: var(--text); border-color: var(--accent); }
  .lang-switch ul {
    position: absolute; inset-inline-end: 0; top: calc(100% + 8px); min-width: 190px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 6px; list-style: none; z-index: 60;
  }
  .lang-switch ul button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: start;
    background: none; border: 0; border-radius: 7px; padding: 9px 10px;
    color: var(--text); font: inherit; font-size: .9rem; cursor: pointer; transition: background .2s;
  }
  .lang-switch ul button:hover { background: var(--bg2); }
  .lang-switch ul button[aria-current="true"] { color: var(--accent); font-weight: 600; }
  .lang-switch img {
    width: 21px; height: 15px; flex-shrink: 0; border-radius: 2px;
    object-fit: cover; background: var(--border);
  }
  .burger { display: none; background: none; border: 0; color: var(--text); font-size: 1.6rem; cursor: pointer; }

  /* hero */
  .hero {
    position: relative; overflow: hidden; text-align: center;
    min-height: calc(100svh - 68px);
    display: flex; flex-direction: column; justify-content: center;
    padding: clamp(24px, 6vh, 90px) 0 clamp(84px, 13vh, 150px);
  }
  section[id] { scroll-margin-top: 68px; }
  .hero::before {
    content: ''; position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
    width: 800px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,.15), transparent 70%);
    pointer-events: none;
  }
  .badge {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--accent); font-size: .85rem;
    font-weight: 500; margin-bottom: 24px; background: var(--bg2);
  }
  .hero h1 {
    font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 800; line-height: 1.15;
    letter-spacing: -0.03em; max-width: 820px; margin: 0 auto 20px;
  }
  .hero p { color: var(--muted); font-size: 1.15rem; max-width: 640px; margin: 0 auto 40px; }
  .scroll-cue {
    position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%);
    display: inline-flex; flex-direction: column; align-items: center; gap: 12px;
    color: var(--muted); font-size: .7rem; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase;
    transition: color .3s ease;
  }
  .scroll-cue:hover { color: var(--accent); }
  .scroll-cue svg { width: 26px; height: 40px; display: block; }
  .scroll-cue .wheel { fill: currentColor; }
  html.motion .scroll-cue .wheel { animation: wheel 2s cubic-bezier(.4, 0, .2, 1) infinite; }
  @keyframes wheel {
    0%   { transform: translateY(0); opacity: 0; }
    18%  { opacity: 1; }
    62%  { transform: translateY(10px); opacity: 0; }
    100% { transform: translateY(10px); opacity: 0; }
  }

  .hero-particles {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; display: block; pointer-events: none;
  }
  .hero .container { position: relative; z-index: 1; }

  /* grids */
  .grid { display: grid; gap: 24px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .card {
    position: relative; isolation: isolate;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px;
    transition: border-color .35s ease, transform .5s cubic-bezier(.16, 1, .3, 1),
                box-shadow .5s cubic-bezier(.16, 1, .3, 1);
  }
  /* pointer-tracked light: --mx/--my are written by script.js while hovering */
  .card::before {
    content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%),
                rgba(34, 211, 238, .13), transparent 70%);
    opacity: 0; transition: opacity .4s ease;
  }
  .card:hover::before { opacity: 1; }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-6px);
    box-shadow: 0 22px 44px -26px rgba(0, 0, 0, .9);
  }
  .card .icon {
    width: 30px; height: 30px; margin-bottom: 18px; color: var(--accent);
    transition: transform .5s cubic-bezier(.16, 1, .3, 1);
  }
  .card .icon svg { width: 100%; height: 100%; display: block; }
  .card:hover .icon { transform: translateY(-2px) scale(1.06); }
  .card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
  .card p { color: var(--muted); font-size: .95rem; }

  /* stack */
  .stack-list { display: flex; flex-wrap: wrap; gap: 12px; }
  .stack-list span {
    padding: 10px 18px; border-radius: 8px; background: var(--card);
    border: 1px solid var(--border); font-weight: 500; font-size: .9rem;
    transition: border-color .3s ease, color .3s ease, transform .4s cubic-bezier(.16, 1, .3, 1);
  }
  .stack-list span:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-3px); }

  /* process */
  .step { position: relative; }
  .step .num {
    width: 44px; height: 44px; border-radius: 10px; background: var(--accent);
    color: #0b0f19; font-weight: 800; display: flex; align-items: center;
    justify-content: center; margin-bottom: 16px; font-size: 1.1rem;
  }

  /* contact */
  .contact-item .label { color: var(--muted); font-size: .85rem; margin-bottom: 4px; }
  .contact-item .value { font-weight: 600; word-break: break-word; }
  .contact-item .value a:hover { color: var(--accent); }

  footer {
    border-top: 1px solid var(--border); padding: 32px 0; text-align: center;
    color: var(--muted); font-size: .9rem;
  }

  /* ---------- motion ----------
     Every rule below is gated on html.motion, which script.js adds only when the
     visitor has not asked for reduced motion. Without it the page renders settled. */
  .hero-inner { will-change: transform; }
  .hero-particles { will-change: transform; }

  html.motion .hero-particles { opacity: 0; transition: opacity .9s ease; }
  html.motion body.hero-in .hero-particles { opacity: 1; }

  html.motion .hero .badge,
  html.motion .hero p { opacity: 0; transform: translateY(20px); }
  html.motion .scroll-cue { opacity: 0; transform: translateX(-50%) translateY(20px); }
  html.motion .hero h1 {
    opacity: 0; clip-path: inset(100% -5% -12% -5%); transform: translateY(20px);
  }
  html.motion body.hero-in .hero .badge,
  html.motion body.hero-in .hero p,
  html.motion body.hero-in .hero h1 {
    opacity: 1; transform: none; clip-path: inset(-12% -5% -12% -5%);
    transition: opacity .7s cubic-bezier(.16, 1, .3, 1),
                transform .7s cubic-bezier(.16, 1, .3, 1),
                clip-path .8s cubic-bezier(.16, 1, .3, 1);
  }
  html.motion body.hero-in .hero .badge { transition-delay: .04s; }
  html.motion body.hero-in .hero h1 { transition-delay: .12s; }
  html.motion body.hero-in .hero p { transition-delay: .3s; }
  html.motion body.hero-in .scroll-cue {
    opacity: 1; transform: translateX(-50%);
    transition: opacity .7s cubic-bezier(.16, 1, .3, 1) .5s,
                transform .7s cubic-bezier(.16, 1, .3, 1) .5s;
  }

  /* section headings wipe; cards rise as a list. Deliberately not the same entrance. */
  html.motion .reveal-head h2,
  html.motion .reveal-head .subtitle {
    opacity: 0; clip-path: inset(100% -5% -12% -5%); transform: translateY(14px);
  }
  html.motion .reveal-head.in h2,
  html.motion .reveal-head.in .subtitle {
    opacity: 1; clip-path: inset(-12% -5% -12% -5%); transform: none;
    transition: opacity .65s cubic-bezier(.16, 1, .3, 1),
                transform .65s cubic-bezier(.16, 1, .3, 1),
                clip-path .75s cubic-bezier(.16, 1, .3, 1);
  }
  html.motion .reveal-head.in .subtitle { transition-delay: .09s; }

  html.motion .reveal-item { opacity: 0; transform: translateY(24px); }
  html.motion .reveal-item.in {
    opacity: 1; transform: none;
    transition: opacity .6s cubic-bezier(.16, 1, .3, 1),
                transform .6s cubic-bezier(.16, 1, .3, 1);
    transition-delay: var(--d, 0ms);
  }

  /* language swap reads as a state change rather than a flicker */
  html.motion [data-i18n] { transition: opacity .16s ease, filter .16s ease; }
  html.motion body.swapping [data-i18n] { opacity: .35; filter: blur(1.5px); }

  html.motion .lang-switch ul {
    transform-origin: top; transform: translateY(-6px) scale(.97); opacity: 0;
    transition: opacity .2s ease, transform .28s cubic-bezier(.16, 1, .3, 1);
  }
  html.motion .lang-switch details[open] ul { transform: none; opacity: 1; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    html { scroll-behavior: auto; }
  }

  @media (max-width: 900px) {
    .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    section { padding: 64px 0; }
    .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .burger { display: block; }
    .nav-links {
      display: none; position: absolute; top: 68px; left: 0; right: 0;
      flex-direction: column; background: var(--bg2); padding: 20px 24px;
      border-bottom: 1px solid var(--border); gap: 18px;
    }
    .nav-links.open { display: flex; }
    .lang-switch ul { inset-inline-end: auto; inset-inline-start: 0; }
  }
</style>
</head>
<body>

<div class="loader" aria-hidden="true">
  <span class="loader-label">Sayogi<span>Creative</span></span>
  <span class="loader-count">0</span>
  <span class="loader-bar"></span>
</div>

<header>
  <nav class="container">
    <a href="#" class="logo">Sayogi<span>Creative</span></a>
    <ul class="nav-links">
      <li><a href="#services" data-i18n="nav.services"></a></li>
      <li><a href="#addons" data-i18n="nav.addons"></a></li>
      <li><a href="#process" data-i18n="nav.process"></a></li>
      <li><a href="#contact" data-i18n="nav.contact"></a></li>
      <li class="lang-switch">
        <details>
          <summary aria-label="Language"></summary>
          <ul></ul>
        </details>
      </li>
    </ul>
    <button class="burger" aria-label="Menu">☰</button>
  </nav>
</header>

<section class="hero">
  <canvas class="hero-particles" aria-hidden="true"></canvas>
  <div class="container hero-inner">
    <div class="badge" data-i18n="hero.badge"></div>
    <h1 data-i18n="hero.title"></h1>
    <p data-i18n="hero.subtitle"></p>
  </div>
  <a href="#services" class="scroll-cue">
    <svg viewBox="0 0 26 40" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="1" y="1" width="24" height="38" rx="12"/>
      <circle class="wheel" cx="13" cy="11" r="2.2" stroke="none"/>
    </svg>
    <span data-i18n="hero.scroll"></span>
  </a>
</section>

<section id="services">
  <div class="container" data-head>
    <h2 data-i18n="services.title"></h2>
    <p class="subtitle" data-i18n="services.subtitle"></p>
    <div class="grid grid-3">
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.3 10.2a2 2 0 0 0 2 1.6h7.1a2 2 0 0 0 2-1.6L20 7.5H6"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></div><h3 data-i18n="services.1.title"></h3><p data-i18n="services.1.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v4M15 2.5v4"/><path d="M6.5 6.5h11v4.2a5.5 5.5 0 0 1-11 0V6.5Z"/><path d="M12 16.2v5.3"/></div><h3 data-i18n="services.2.title"></h3><p data-i18n="services.2.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3.5" width="18" height="17" rx="2"/><path d="M3 9h18M9.5 20.5V9"/></div><h3 data-i18n="services.3.title"></h3><p data-i18n="services.3.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2.8 8.5 4.6-8.5 4.6-8.5-4.6 8.5-4.6Z"/><path d="m3.5 12.4 8.5 4.6 8.5-4.6"/><path d="m3.5 17 8.5 4.6 8.5-4.6"/></div><h3 data-i18n="services.4.title"></h3><p data-i18n="services.4.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8.5 8.5-4 3.8 4 3.8M15.5 8.5l4 3.8-4 3.8"/><path d="M13.6 4.6 10.4 19.4"/></div><h3 data-i18n="services.5.title"></h3><p data-i18n="services.5.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.6 6.6a1 1 0 0 0 0 1.4l1.4 1.4a1 1 0 0 0 1.4 0l3.3-3.3a5.5 5.5 0 0 1-7.2 7.2l-6.3 6.3a2 2 0 0 1-2.8-2.8l6.3-6.3a5.5 5.5 0 0 1 7.2-7.2l-3.3 3.3Z"/></div><h3 data-i18n="services.6.title"></h3><p data-i18n="services.6.desc"></p></div>
    </div>
  </div>
</section>

<section id="addons" style="background: var(--bg2);">
  <div class="container" data-head>
    <h2 data-i18n="addons.title"></h2>
    <p class="subtitle" data-i18n="addons.subtitle"></p>
    <div class="grid grid-3">
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20.5v-6M4 10.5v-7M12 20.5v-8M12 8.5v-5M20 20.5v-4M20 12.5v-9"/><path d="M1.5 14.5h5M9.5 8.5h5M17.5 16.5h5"/></div><h3 data-i18n="addons.1.title"></h3><p data-i18n="addons.1.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.5h4.2a2.3 2.3 0 1 1 4.6 0H18v4.2a2.3 2.3 0 1 0 0 4.6v4.2h-4.2a2.3 2.3 0 1 0-4.6 0H5v-4.2a2.3 2.3 0 1 1 0-4.6V5.5Z"/></div><h3 data-i18n="addons.2.title"></h3><p data-i18n="addons.2.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="10" height="8.5" rx="1.5"/><path d="m4.6 11 2.1-2.4 1.7 1.9 1.4-1.5"/><circle cx="9.3" cy="7" r=".9"/><path d="M12.5 17.5h9M17.5 14l4 3.5-4 3.5"/></div><h3 data-i18n="addons.3.title"></h3><p data-i18n="addons.3.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5h13.2l-3.4-3.4"/><path d="M20.5 15.5H7.3l3.4 3.4"/></div><h3 data-i18n="addons.4.title"></h3><p data-i18n="addons.4.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.2 12h17.6"/><path d="M12 3a13.5 13.5 0 0 1 0 18 13.5 13.5 0 0 1 0-18Z"/></div><h3 data-i18n="addons.5.title"></h3><p data-i18n="addons.5.desc"></p></div>
      <div class="card reveal-item"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.2 13.3a4.6 4.6 0 0 0 6.9.5l2.7-2.7a4.6 4.6 0 0 0-6.5-6.5l-1.6 1.6"/><path d="M13.8 10.7a4.6 4.6 0 0 0-6.9-.5l-2.7 2.7a4.6 4.6 0 0 0 6.5 6.5l1.6-1.6"/></div><h3 data-i18n="addons.6.title"></h3><p data-i18n="addons.6.desc"></p></div>
    </div>
  </div>
</section>

<section id="stack">
  <div class="container" data-head>
    <h2 data-i18n="stack.title"></h2>
    <p class="subtitle" data-i18n="stack.subtitle"></p>
